name: Deploy Next.js (estático) a EC2

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copiar out/ a EC2
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no" ./out/ ${{secrets.EC2_USER}}@${{ secrets.EC2_HOST}}:~/out/ 
          ssh -i ~/.ssh/key.pem -oStrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "eudo rm -rf /usr/share/nginx/html/* && sudo mkdir -p /usr/share/nginx/html && sudo cp -r ~/out/* /usr/share/nginx/html/ && sudo systemctl restart nginx || sudo service nginx restart"